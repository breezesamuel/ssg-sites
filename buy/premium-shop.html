<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GasRoute · AI 自动化实验室商店</title>
<style>
:root{--bg:#0b0e14;--card:#141926;--line:#232c3d;--fg:#e8edf5;--dim:#8b95a7;--acc:#38e09c;--warn:#ff9f43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif}
.header{padding:34px 20px 26px;text-align:center;border-bottom:1px solid var(--line);background:radial-gradient(600px 200px at 50% -40px,rgba(56,224,156,.14),transparent)}
.header h1{margin:0 0 6px;font-size:24px}.header p{margin:0;color:var(--dim)}
.wrap{max-width:1040px;margin:26px auto;padding:0 18px}
h2{font-size:18px;margin:26px 0 12px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .name{font-weight:700}.card .desc{color:var(--dim);font-size:13px;min-height:40px}
.price{color:var(--acc);font-weight:800;font-size:18px}
.btn{margin-top:auto;background:var(--acc);color:#06231a;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
#obox{display:none;margin-top:18px;padding:14px;border:1px solid var(--acc);border-radius:10px;background:rgba(56,224,156,.06)}
#obox a{color:var(--acc);word-break:break-all}
.log{white-space:pre-wrap;color:var(--dim);font-size:13px}
.foot{margin:40px 0 26px;color:var(--dim);font-size:12px;text-align:center}
</style>
<div class="header">
  <h1>丙大山 · AI 自动化实验室</h1>
  <p>数字产品 · AI 服务 · GasRoute 链上数据入口 —— 让你的自动化省下真金白银</p>
</div>
<div class="wrap">
  <div id="obox"></div>
  <h2>数字产品</h2>
  <div class="products" id="prods">加载中…</div>
  <h2>自动化服务(按需开通)</h2>
  <table id="svc"><tr><th>服务</th><th>状态</th><th>说明</th></tr></table>
  <p class="foot">付款说明:点「购买」生成 PayPal 支付链接 → 付款后回到聊天联系兑现。实时数据入口:<span id="gw" style="color:var(--acc)"></span></p>
</div>
<script>
const $=q=>document.querySelector(q)
async function jd(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined});return r.json()}
async function init(){
  try{
    const [p,s,h]=await Promise.all([jd('/shop/api/products'),jd('/shop/api/services'),jd('/shop/api/health')])
    $('#prods').innerHTML=(p.products||[]).map(s=>'<div class=card><div class=name>'+s.name+'</div><div class=desc>'+s.desc+'</div><div class=price>$'+(+s.price).toFixed(2)+'</div><button class="btn" onclick="buy(\''+s.sku+'\',\''+s.name.replace(/'/g,"\\'")+'\','+s.price+')">购买</button></div>').join('')
    const sl=(s.services?Object.entries(s.services):[])
    $('#svc').innerHTML='<tr><th>服务</th><th>状态</th><th>说明</th></tr>'+sl.map(([id,v])=>'<tr><td>'+(v.label||id)+'</td><td>'+(v.status||'')+'</td><td>'+(v.needs||'')+'</td></tr>').join('')
    $('#gw').textContent=location.origin+'/gasroute/health'
  }catch(e){$('#prods').textContent='加载失败: '+e.message}
}
async function buy(sku,name,price){
  const box=$('#obox');box.style.display='block';box.innerHTML='<div class=log>正在生成 PayPal 收款单…</div>'
  try{
    const r=await jd('/shop/api/paypal/create',{amount:price,description:sku+' '+name})
    box.innerHTML='<b>支付单已生成</b>('+r.status+' ,单号 '+r.orderId+')<br>点此支付: <a href="'+r.approvalUrl+'" target=_blank>'+r.approvalUrl+'</a><br><div class=log>支付完成后回到聊天告知单号,我们确认到账并交付。</div>'
    window.open(r.approvalUrl,'_blank')
  }catch(e){box.innerHTML='<div class=log>失败: '+e.message+'</div>'}
}
init()
</script>
